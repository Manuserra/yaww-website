<!-- Fonts: Libre Baskerville (headings) + Raleway (body) -->

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ============================================================
   YAWW DESIGN TOKENS
   Same tokens as index-sidebar-descriptions-nohero.html / yaww-tokens.json
   Fonts: Libre Baskerville (headings) · Raleway (body)
   ============================================================ */
:root {
  /* --- Color · Primary / Sea Blue --- */
  --sea-blue:        #475764;
  --sea-blue-100:    #8094A5;
  --sea-blue-200:    #657C8F;
  --sea-blue-300:    #516372;
  --sea-blue-400:    #3C4A55;
  --sea-blue-500:    #283139;

  /* --- Color · Secondary / Stone --- */
  --stone:           #F7F2F0;
  --stone-100:       #FDF9F7;
  --stone-200:       #F1EFEB;
  --stone-300:       #E1DCD6;
  --stone-400:       #C6BFB9;
  --stone-500:       #A6A29E;
  --stone-600:       #877C71;

  /* --- Semantic --- */
  --page-bg:         var(--stone);
  --header-bg:       var(--stone);
  --hairline:        var(--stone-400);
  --nav-ink:         #222D36;

  /* --- Type families --- */
  --font-heading: "Libre Baskerville", Georgia, serif;
  --font-body:    "Raleway", -apple-system, system-ui, sans-serif;

  /* --- Layout --- */
  --container-max: 1440px;
  --container-pad: 24px;
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg);
  color: var(--sea-blue);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
ul { list-style: none; margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.container {
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--container-pad);
}

/* ============================================================
   SITE HEADER (shared component — same as retreats listing page)
   ============================================================ */
/* The logo row used to be sticky together with the nav, hidden on
   scroll via a scrollY>64 threshold that snapped a max-height/opacity
   transition — a hard binary state flipping on a single pixel
   crossing, which stutters the moment the scroll position hovers
   near that line (exactly what Lenis's inertia does while settling).
   The reference site (diegodelbono.com/yoga, same header/logo) does
   this with no JS at all: only the nav row is sticky; the logo above
   it is plain static content that simply scrolls away at scroll
   speed, the same as any other element leaving the top of the
   viewport. Matched that here — .site-header is just a background
   wrapper now, .site-header__nav carries the sticky behavior alone. */
.site-header {
  background: var(--header-bg);
}
.site-header__brand {
  border-bottom: 1px solid var(--hairline);
}
.site-header__brand .container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-block: 24px 16px;
}
.site-header__logo { display: block; line-height: 0; color: var(--sea-blue); }
.site-header__logo svg { display: block; width: 364px; height: 41px; max-width: 100%; }
.site-header__logo--nav { display: none; }   /* shown only from the hamburger breakpoint down */

.site-header__nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  border-bottom: 1px solid var(--hairline);
}
.site-header__nav .container { display: flex; align-items: center; min-height: 55px; }
.nav-list { flex: 1; display: flex; justify-content: space-between; align-items: center; }
.nav-list a {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 16px; border-radius: 8px;
  font-family: var(--font-body); font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.32px;
  color: var(--nav-ink);
  transition: background-color .15s ease, color .15s ease;
}
.nav-list a:hover { background: var(--stone-200); color: var(--sea-blue-500); }
.nav-list a[aria-current="page"] { color: var(--sea-blue-500); font-weight: 600; }
.nav-list a:focus-visible { outline: 2px solid var(--sea-blue-300); outline-offset: 2px; }
.nav-toggle { display: none; }

@media (max-width: 1024px) { :root { --container-pad: 16px; } }

@media (max-width: 767px) {
  .site-header__logo svg { width: 220px; height: auto; }
  .site-header__brand { display: none; }
  .site-header__nav .container { position: relative; justify-content: flex-end; }
  .site-header__logo--nav {
    display: block;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; color: var(--nav-ink);
  }
  .nav-toggle svg { display: block; }
  .nav-list {
    display: none; position: absolute; left: 0; right: 0; top: 100%;
    flex-direction: column; background: var(--header-bg);
    border-bottom: 1px solid var(--hairline);
    padding: 8px var(--container-pad) 16px;
  }
  .site-header__nav.is-open .nav-list { display: flex; }
  .nav-list li { width: 100%; }
  .nav-list a { justify-content: flex-start; width: 100%; }
}

/* ============================================================
   RETREAT PAGE
   Specs pulled from Figma Dev Mode — "Explorations - Retreat page"
   frame "Beach Scape Retreat" (node 394-65716).
   ============================================================ */
main { padding-top: 0; }

/* --- Hero ("Header" frame) -------------------------------- */
.retreat-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 24px;
}
/* Fluid like the home variant's own hero photo: no max-width cap (a
   constant 24px gutter at any width instead, .retreat-hero's own
   padding is what bounds it), height tracks the viewport instead of a
   fixed ratio. 138px is .site-header + .site-header__nav's combined
   height — see index-fluid-hero.html's .home-hero__media for the full
   reasoning on both numbers; same page architecture, same header. */
.retreat-hero__image {
  position: relative;
  width: 100%;
  height: calc(100vh - 138px - 48px);
  height: calc(100dvh - 138px - 48px);
  overflow: hidden;
  background: var(--stone-200) url("images/iceland/hero.jpg") center / cover no-repeat;
}
/* The retreat name now sits as a card on the photo itself, flush with
   its bottom edge, instead of as a heading below it. */
.retreat-hero__title {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  margin: 0;
  padding: 12px 16px;
  background: var(--stone);
  white-space: nowrap;
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
  font-size: 45.728px;
  line-height: normal;
  color: var(--sea-blue);
}

.retreat-hero__copy {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
/* Location, date and teacher as one line instead of three stacked
   pieces. .retreat-hero__meta keeps its own element (date first,
   then the dot, then teacher) rather than being merged into flat
   text, because the sticky booking bar's own script reads
   ".retreat-hero__meta span" for the date — restructuring the markup
   instead of just the CSS would have silently broken that. */
.retreat-hero__line {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 15px;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 18px;
  line-height: 24px;
  color: var(--sea-blue);
}
.retreat-hero__meta {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 15px;
  font: inherit;
  color: inherit;
}

.retreat-hero__ctas .btn { width: 286px; }
.retreat-hero__ctas { display: flex; align-items: center; gap: 16px; }
.retreat-hero__price {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.32px;
  color: var(--sea-blue);
}
/* --- Button (shared component) -----------------------------------------
   One pair for the whole site: filled primary, outlined secondary. Size and
   width are layout, not identity, so each context sets its own — the hero
   pins 286px, the booking rail goes full width.

   The secondary used to be stone-400 text on the stone ground: 1.63:1,
   against the 4.5:1 WCAG asks for at this size. It was legible as a shape
   and almost not as words. It now carries the same sea-blue as the primary,
   which measures 6.7:1, and the border does the work of telling the two
   apart instead of the text being faded. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 56px;
  padding: 16px 32px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  line-height: 24px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid transparent;
  border-radius: 0;
  cursor: pointer;
  /* colour only — nothing that shifts layout or moves under the cursor */
  transition: background-color .18s ease, color .18s ease, border-color .18s ease;
}
.btn:focus-visible { outline: 2px solid var(--sea-blue-300); outline-offset: 2px; }

.btn--primary {
  background: var(--sea-blue);
  border-color: var(--sea-blue);
  color: var(--stone);
}
/* Deepens rather than lightens: a filled button that pales on hover reads as
   going disabled. */
.btn--primary:hover  { background: var(--sea-blue-400); border-color: var(--sea-blue-400); }
.btn--primary:active  { background: var(--sea-blue-500); border-color: var(--sea-blue-500); }

/* Same stone-600 as the itinerary progress line: sand ink and border on the
   page ground, and on hover the whole button becomes that line's colour with
   the label in the page's sand. */
.btn--secondary {
  background: transparent;
  border-color: var(--stone-600);
  color: var(--stone-600);
}
.btn--secondary:hover,
.btn--secondary:active { background: var(--stone-600); border-color: var(--stone-600); color: var(--stone); }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }


/* --- About ------------------------------------------------ */
.retreat-about {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 56px 24px;
}
.retreat-about__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
.retreat-about__body {
  display: flex;
  flex-direction: column;
  gap: 32px;
  max-width: 745px;
}
.retreat-about__body p {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.32px;
  text-align: justify;
  color: var(--sea-blue);
}

/* --- About Teacher (node 115-42277) ------------------------ */
.retreat-teacher {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 56px 24px;
}
.retreat-teacher__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
.retreat-teacher__row {
  display: flex;
  width: 100%;
  max-width: 884px;   /* fluid below 884+padding instead of hard-overflowing */
  justify-content: center;
  align-items: center;
  gap: 104px;
}
.retreat-teacher__photo {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  flex: none;
  width: 312px;
  height: 408px;
  background: linear-gradient(155deg, hsl(96 26% 74%), hsl(96 20% 52%));
  /* placeholder — real photo of the teacher slots in later */
}
.retreat-teacher__text {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1 0 0;
  color: var(--sea-blue);
  text-align: justify;
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 24px;
  letter-spacing: 0.32px;
}
.retreat-teacher__text p { margin: 0; }

/* --- Tabs (shared component) -------------------------------------------
   Includes and Accommodations were two near-identical copies of this, and
   the listing page uses the same pattern. The bar HUGS its tabs, so the
   hairline ends exactly where the tabs end instead of running past them,
   and the active tab's 2px indicator sits on that hairline. */
.tabs {
  position: relative;   /* the sliding indicator measures against this bar */
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 100%;
  border-bottom: 1px solid var(--stone-400);
}
.tabs__item {
  position: relative;
  padding: 12px 24px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 12px;
  line-height: 24px;
  letter-spacing: 0.48px;
  text-transform: uppercase;
  color: var(--sea-blue-100);
  background: none;
  border: 0;
  cursor: pointer;
}
.tabs__item.is-active { color: var(--sea-blue); }
.tabs__item.is-active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--sea-blue);
}
.tabs__item:focus-visible { outline: 2px solid var(--sea-blue-300); outline-offset: 2px; }

/* Two equal slots: the labels are short and never change (Includes). */
.tabs--fixed .tabs__item { width: 216px; gap: 16px; white-space: nowrap; }
/* Labels are names of arbitrary length (Accommodations), so the tabs hug
   their text and the row wraps instead of clipping. */
.tabs--hug { gap: 10px; }
.tabs--hug .tabs__item { min-width: 216px; }

@media (max-width: 767px) {
  .tabs--fixed { width: 100%; }
  .tabs--fixed .tabs__item { width: auto; flex: 1 1 0; padding: 12px 8px; }
}
@media (max-width: 480px) {
  .tabs--hug .tabs__item { min-width: 0; padding: 12px 8px; }
}

/* --- Includes (node "Includes" · 1440x759 bg photo + white card) ------- */
.retreat-includes {
  position: relative;
  overflow: hidden;   /* clips the oversized parallax bg layer */
  display: flex;
  /* The band used to be pinned to the Figma frame's 759px with the card
     centred, which meant the padding was never what you actually saw: the
     gap was just the leftover space, and it changed with the length of the
     list — 67px on a ten-item card, 19px on a thirteen-item one. Height now
     follows the content so the 48px is real and identical on every page. */
  /* 96px, not 48: the padding IS the parallax — it is the only strip of the
     image you ever see, so a wider band puts more of the layer's travel on
     screen. On a phone it would eat the screen, so it goes back to 48. */
  padding: 80px 24px;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 56px;
}
/* Parallax bg: sized 150% tall / offset -25% so it always has enough travel
   room in either direction before its edge could show — see the JS clamp
   below, which caps movement at 20% (leaving a 5% safety margin). */
.retreat-includes__bg {
  position: absolute;
  left: 0; right: 0;
  top: -25%;
  height: 150%;
  background-image: url("images/iceland/includes.jpg"), linear-gradient(155deg, hsl(150 20% 68%), hsl(150 24% 38%));
  background-size: cover, cover;
  background-position: 50% 35%, 50%;
  background-repeat: no-repeat, no-repeat;
  will-change: transform;
  pointer-events: none;
}
.retreat-includes__card {
  position: relative;   /* stacks above the absolutely-positioned bg layer */
  z-index: 1;
  display: flex;
  padding: 48px;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  background: var(--stone);
}
.retreat-includes__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
/* --- Rooms pricing -----------------------------------------------------
   One card per tier, in a two-up grid. A card is self-contained — photo,
   name, price, and the hotels that offer that tier — so the module reads
   the same with one tier or six, and a tier gains a hotel without any
   column maths. */
.rooms {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 56px 24px;
  background: var(--stone);
}
.rooms__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
/* --- How to book (sticky rail) -----------------------------------------
   The section becomes the site's 12-column grid: 4 columns for the rail,
   8 for the cards. With the desktop tokens (72px column, 48px gutter) that
   is 432 + 48 + 912 = 1392, so the cards keep exactly the 912 they had and
   stay aligned with the gallery further up the page.

   The rail is sticky because choosing a room is a comparison task: you
   scroll the options several times, and the terms of the purchase should
   not scroll away while you do. */
.rooms__inner {
  width: 100%;
  max-width: 1392px;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: 48px;
}
.rooms__grid  { grid-column: 5 / span 8; grid-row: 1; }
/* Placed by grid rather than by DOM order: the cards come first in the
   markup, so stacked on a phone you meet the options before the terms, and
   the CTA is never asked for before there is anything to choose. */
.rooms__aside {
  grid-column: 1 / span 4;
  grid-row: 1;
  align-self: start;
  position: sticky;
  top: 162px;                              /* 138px sticky header + 24 */
  max-height: calc(100vh - 186px);         /* header + 24 top + 24 bottom */
  overflow-y: auto;
  scrollbar-width: thin;
}
.rooms__aside-title {
  margin: 0 0 20px;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 20px;
  line-height: 28px;
  color: var(--sea-blue);
}
.rooms__steps {
  counter-reset: step;
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.rooms__steps li {
  counter-increment: step;
  position: relative;
  padding-left: 34px;
}
.rooms__steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 1px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--stone-400);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  color: var(--sea-blue-200);
}
.rooms__steps strong {
  display: block;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  line-height: 22px;
  color: var(--sea-blue);
}
.rooms__steps span {
  display: block;
  margin-top: 2px;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 22px;
  color: var(--sea-blue-200);
}
/* The question every solo traveller has before picking a shared room. */
.rooms__aside-note {
  margin: 20px 0 0;
  padding-top: 20px;
  border-top: 1px solid var(--stone-300);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 22px;
  color: var(--sea-blue-200);
}
.rooms__actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 24px;
}
.rooms__actions .btn { width: 100%; }
.rooms__aside-fine {
  margin: 12px 0 0;
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 18px;
  color: var(--sea-blue-100);
}

@media (max-width: 1024px) {
  /* Below the desktop grid the rail stops being a rail: two card columns
     plus a 4-column aside would leave neither enough room. */
  .rooms__inner { grid-template-columns: minmax(0, 1fr); }
  .rooms__grid  { grid-column: 1; grid-row: auto; }
  .rooms__aside {
    grid-column: 1;
    grid-row: auto;
    position: static;
    max-height: none;
    overflow: visible;
    margin-top: 48px;
    max-width: 560px;
  }
}


.rooms__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  /* One gutter of the page grid. The card area spans columns 5-12, so at 48
     each card lands on exactly four columns (4x72 + 3x48 = 432) and the
     cards line up with everything else on the page. */
  gap: 48px;
}

.rooms__card {
  display: flex;
  flex-direction: column;
  background: var(--stone-100);
  border: 1px solid var(--stone-300);
  border-radius: 2px;
  overflow: hidden;
}
/* The card's photo is a slider, so the box sets the ratio and the shared
   component fills it. */
.rooms__media {
  width: 100%;
  aspect-ratio: 4 / 3;
}
.rooms__media .photo-slider__slide img { cursor: zoom-in; }
.rooms__body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 24px;
}

/* flex-start, not baseline: the price is a two-line stack, and its first
   line should sit level with the tier name rather than its last. */
.rooms__head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.rooms__tier-name {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 20px;
  line-height: 28px;
  color: var(--sea-blue);
}
.rooms__price { flex: 0 0 auto; }
/* Full sea-blue, not a muted grey: the price is what the card is for. */
.rooms__price-amount {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 20px;
  line-height: 28px;
  color: var(--sea-blue);
  text-align: right;
  white-space: nowrap;
}
.rooms__price-unit {
  margin: 0;
  font-family: var(--font-body);
  font-size: 11px;
  line-height: 16px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--sea-blue-200);
  text-align: right;
}

/* Rules between hotels only, never above the first or below the last: the
   card's own border already closes the list at both ends. A tier with a
   single hotel therefore draws no rule at all. */
.rooms__hotels { display: flex; flex-direction: column; }
.rooms__hotel {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 12px;
}
.rooms__hotel + .rooms__hotel { border-top: 1px solid var(--stone-300); }
.rooms__thumb {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  object-fit: cover;
  cursor: zoom-in;
}
.rooms__hotel-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.rooms__hotel-name {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  line-height: 20px;
  color: var(--sea-blue);
}
.rooms__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rooms__chip {
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 16px;
  color: var(--sea-blue-200);
  padding: 4px 10px;
  border: 1px solid var(--stone-300);
  border-radius: 63px;
  white-space: nowrap;
}

/* One CTA for the module, not one per card: the choice of tier is made in
   the grid, and four identical buttons would only add noise to it. */


/* Mobile: one column, and a squatter photo so a card still fits its price
   and hotel list on screen together. */
@media (max-width: 767px) {
  .rooms { padding: 56px 16px; }
  .rooms__grid { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .rooms__media { aspect-ratio: 3 / 2; }
  .rooms__body { padding: 20px; }
  /* Only a genuinely long name drops the price beneath it; the class is set
     in JS, since CSS cannot ask how long a string is. */
  .rooms__card--stacked .rooms__head { display: block; }
  .rooms__card--stacked .rooms__price-amount,
  .rooms__card--stacked .rooms__price-unit { text-align: left; }
  .rooms__card--stacked .rooms__price { margin-top: 4px; }
}

/* --- Carbon offset -----------------------------------------------------
   Three centred lines and nothing else. It comes after the photographs, at
   the end of the page, and it is the one thing here the reader does for
   somebody other than themselves — so it is set at caption size rather than
   body size: present, findable, and deliberately not competing with the
   retreat it follows. */
.carbon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 56px 24px;
  background: var(--stone);
}
.carbon__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
.carbon__text {
  margin: 0;
  width: 668px;
  max-width: 100%;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 14px;
  line-height: 24px;
  letter-spacing: 0.56px;
  color: var(--sea-blue);
  text-align: center;
}
/* Underlined, which the frame does not show. Set in the same face, size,
   colour and alignment as the paragraph above it, this line is typographically
   identical to body copy — there would be nothing to tell a reader it can be
   clicked, and it is the only action in the module. The underline is offset
   and thinned so it stays quiet; the hover then closes the gap to the text. */
.carbon__link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  text-decoration-color: var(--stone-600);
  transition: text-decoration-color .18s ease, text-underline-offset .18s ease;
}
@media (hover: hover) and (pointer: fine) {
  .carbon__link:hover {
    text-decoration-color: var(--sea-blue);
    text-underline-offset: 2px;
  }
}
.carbon__link:focus-visible { outline: 2px solid var(--sea-blue-300); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .carbon__link { transition: none; } }

@media (max-width: 767px) {
  .carbon { padding: 56px 16px; gap: 32px; }
}

/* --- Additional info (FAQ) ---------------------------------------------
   An accordion, built as buttons and regions rather than <details>. <details>
   would give keyboard support and find-in-page for free, but it stops
   rendering its content when closed, so there is nothing left to animate
   shut — the panel would open smoothly and vanish. Doing it by hand costs
   one aria-expanded and buys a close that is as considered as the open.

   Several can be open at once. Auto-closing the last one is tidier to look
   at and worse to use: these are reference answers, and a reader comparing
   the cancellation policy against what happens if plans change should not
   have one taken away to be given the other. Nothing here is ever closed on
   the reader's behalf. */
.faq-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 56px 24px;
  background: var(--stone);
}
.faq-section__title {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 24px;
  line-height: 40px;
  color: var(--sea-blue);
  text-align: center;
}
/* 672 is six columns and five gutters of the page grid. */
.faq-list { width: 672px; max-width: 100%; }
.faq { border-bottom: 1px solid var(--stone-300); }
.faq__heading { margin: 0; font: inherit; }

.faq__trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 72px;   /* 24 + a 24px line + 24, as drawn; min so a question
                         that wraps on a phone grows instead of clipping */
  padding: 24px 0;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: inherit;
}
.faq__trigger:focus-visible { outline: 2px solid var(--sea-blue-300); outline-offset: 2px; }
.faq__q {
  flex: 1;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.32px;
  color: var(--sea-blue);
  transition: color .18s ease;
}
/* The chevron is the affordance, so it rests one step back from the question
   and comes forward when touched or opened.

   rotate and translate are set as separate properties rather than one
   transform, so the two things they do can move at their own speeds: the
   rotation keeps time with the panel it describes, while the hover nudge
   answers the cursor immediately. Folded into a single transform they would
   have to share one duration, and a 2px hover would take half a second to
   arrive. */
.faq__chev {
  flex: none;
  width: 16px;
  height: 16px;
  display: block;
  color: var(--sea-blue-200);
  rotate: 0deg;
  translate: 0 0;
  transition: rotate .5s cubic-bezier(.45, 0, .25, 1),
              translate .18s ease,
              color .18s ease;
}
.faq.is-open .faq__chev { rotate: 180deg; color: var(--sea-blue); }

/* Hover: the label deepens and the chevron both darkens and moves two pixels
   in the direction it is about to send the row — down when it will open, up
   when it will close, because the rotation carries the nudge with it. It is
   barely visible and entirely felt: the row answers before it is pressed,
   and the answer is a preview of what pressing does. No background tint —
   a filled row on this flat stone ground would shout. */
@media (hover: hover) and (pointer: fine) {
  .faq__trigger:hover .faq__q { color: var(--sea-blue-500); }
  .faq__trigger:hover .faq__chev { color: var(--sea-blue); translate: 0 2px; }
  .faq.is-open .faq__trigger:hover .faq__chev { translate: 0 -2px; }
}

/* The height animation is a 0fr → 1fr grid row, so it needs no measurement
   and no inline pixel heights: the panel is always exactly as tall as its
   own text, at any width, before the fonts have even loaded.

   Opening is 500ms, closing 400 — the same clock as the gallery, which is
   this page's pace for anything that travels rather than responds. Closing
   stays the quicker of the two: the reader has already read it and is
   putting it away, and making them wait to tidy up is where an unhurried
   brand turns into a slow interface. But the gap is small, so the close does
   not snap shut after a calm open.

   The curve matters more than the duration here. The tab indicator's
   cubic-bezier(.32,.72,0,1) is nearly three quarters of the way there in the
   first third of its time — that lunge is right for a mark darting between
   two tabs and wrong for a panel unfolding, where it reads as a jerk
   followed by a long crawl. This one eases in as well as out: it starts from
   rest, gathers, and settles. Nothing leaves abruptly. */
.faq__panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .4s cubic-bezier(.45, 0, .25, 1);
}
.faq.is-open .faq__panel {
  grid-template-rows: 1fr;
  transition-duration: .5s;
}
/* The text waits 160ms before fading in, so it arrives into a box that has
   already started opening rather than sliding up underneath itself — you
   never catch yourself reading a line that is still moving. The fade itself
   is long and lazy, finishing well before the box does, so the answer is
   settled and readable while the last of the movement is still happening.
   Going away it does not wait: it leaves first, and the box closes on
   nothing. visibility flips only once the box has finished shutting, which
   is what takes the collapsed answer out of the tab order and the screen
   reader. */
.faq__answer {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  transition: opacity .2s ease, visibility 0s .4s;
}
.faq.is-open .faq__answer {
  visibility: visible;
  opacity: 1;
  transition: opacity .34s ease .16s, visibility 0s;
}
.faq__answer p {
  margin: 0 0 24px;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.32px;
  color: var(--sea-blue);
}

@media (max-width: 767px) {
  .faq-section { padding: 56px 16px; gap: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  .faq__panel, .faq__answer, .faq__chev, .faq__q { transition: none; }
}

   height, all hung on one horizontal centre line — the uneven top and bottom
   edges are what stop a row of photographs from reading as a spreadsheet.

   The arrows sit above the strip rather than on it. Because the photos run
   past both edges of the viewport there is no margin left to park a control
