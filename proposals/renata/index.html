<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="../guard.js"></script>
<title>Renata · photo options</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F7F2F0; color: #475764; font: 16px/1.6 Raleway, system-ui, sans-serif; }
  .wrap { max-width: 1392px; margin: 0 auto; padding: 48px 24px; }
  h1 { font: 400 30px/1.2 "Libre Baskerville", serif; margin: 0 0 8px; }
  p.lede { margin: 0 0 40px; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 48px; }
  figure { margin: 0; }
  .card { aspect-ratio: 3 / 4; overflow: hidden; background: #E1DCD6; }
  .wide { aspect-ratio: 672 / 816; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { margin-top: 12px; font-size: 14px; }
  figcaption b { display: block; font: 600 12px/1.4 Raleway, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #765C3A; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Renata Centi · photo</h1>
  <p class="lede">The new photo is live (first). Alongside: the previous one and two alternates from her folder. Each in the 3:4 card ratio used on Facilitators.</p>
  <div class="grid">
    <figure><div class="card"><img src="../../images/people/renata-centi-1.jpg" alt=""></div><figcaption><b>Implemented</b>El Cuyo, laughing</figcaption></figure>
    <figure><div class="card"><img src="../../images/people/renata-centi-prev.jpg" alt=""></div><figcaption><b>Before</b>Previous photo</figcaption></figure>
    <figure><div class="card"><img src="../../images/people/renata-alt-1.webp" alt=""></div><figcaption><b>Alternative 1</b>Hat, green background</figcaption></figure>
    <figure><div class="card"><img src="../../images/people/renata-alt-2.webp" alt=""></div><figcaption><b>Alternative 2</b>Hat, yellow wall</figcaption></figure>
  </div>
</div>
</body>
</html>
